<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ds-effort-slider — standalone demo</title>
<style>
  :root {
    --dsw-alias-brand-primary: #8c73c9;
    --dsw-alias-brand-primary-hover: #a17ec2;
    --dsw-alias-label-primary: #15171b;
    --dsw-alias-label-secondary: #5f5b58;
    --dsw-alias-label-tertiary: #9296a0;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #edeae8;
    --dsw-alias-bg-layer-3: #e0dbd6;
    --dsw-alias-border-l1: rgba(76, 70, 65, 0.12);
    --dsw-specific-menu: #ffffff;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px;
    background: #f7f6f4;
    color: #15171b;
    font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .hint { margin: 0 0 24px; color: #77736f; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding: 12px 16px;
    border: 1px solid rgba(76, 70, 65, 0.12);
    border-radius: 12px;
    background: #fff;
  }

  .controls label { display: inline-flex; align-items: center; gap: 6px; }
  .controls fieldset { display: flex; gap: 10px; margin: 0; padding: 4px 10px; border: 1px solid rgba(76, 70, 65, 0.12); border-radius: 8px; }
  .controls legend { padding: 0 4px; color: #77736f; font-size: 12px; }

  .stage { padding: 24px 0 160px; }

  /* Inline mode renders inside the model menu, whose content box is 244px. */
  .stage[data-mode="inline"] { padding: 24px 0 40px; }

  .menu {
    width: 252px;
    padding: 4px;
    border: 1px solid rgba(76, 70, 65, 0.12);
    border-radius: 12px;
    background: var(--dsw-specific-menu);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
  }

  .menu-row {
    padding: 7px 8px;
    border-radius: 8px;
    color: var(--dsw-alias-label-primary);
  }

  .menu-row span { color: var(--dsw-alias-label-tertiary); }

  /* Panel mode gives the popup its natural 21rem host width and the anchor
     room the panel needs above the trigger. */
  .stage[data-mode="panel"] .menu { width: min(21rem, 100%); }

  .anchor {
    position: relative;
    width: min(21rem, 100%);
    padding-top: 12rem;
  }
</style>
</head>
<body>
  <h1>ds-effort-slider</h1>
  <p class="hint">独立组件演示。直接在浏览器打开本文件即可（classic script，无构建步骤）。</p>

  <div class="controls">
    <label>模式
      <select id="mode">
        <option value="inline">inline（菜单内）</option>
        <option value="panel">panel（弹层）</option>
      </select>
    </label>
    <label>等级
      <input id="level" type="range" min="0" max="3" step="1" value="0" />
      <output id="levelOut">Off</output>
    </label>
    <label>档位集合
      <select id="levels"></select>
    </label>
    <label><input type="checkbox" id="ultracode" checked />Ultracode 氛围</label>
    <label><input type="checkbox" id="liang" />滑动变祖器</label>
    <label><input type="checkbox" id="chibi" />大肥鱼</label>
  </div>

  <div class="stage" id="stage" data-mode="inline">
    <div class="menu">
      <div class="menu-row">模型 <span>示例</span></div>
      <ds-effort-slider
        id="slider"
        inline
        label="推理等级"
        axis-low="更快"
        axis-high="更聪明"
        tooltip="推理等级越高，思考时间越长。Max 会进行最深度的分析和代码检查。"
        input-aria-label="推理等级"
        help-aria-label="关于推理等级"
        liang-label="滑动变祖器"
        liang-asset-base="../assets/liang-frames/"
        chibi-sprite="../assets/chibi-runner-strip.png"
      ></ds-effort-slider>
    </div>
  </div>

  <script src="../src/ds-effort-slider.js"></script>
  <script>
    (function () {
      // 滑块档位来自真实配置：演示页用几组「适配器会公布的档位」验证
      // 档数、顺序、标签与特效是否跟着走。
      var LEVEL_SETS = [
        {
          id: "deepseek",
          label: "Off / Low / High / Max（DeepSeek）",
          levels: [
            { id: "off", label: "关闭", canonical: "off" },
            { id: "low", label: "低", canonical: "low" },
            { id: "high", label: "高", canonical: "high" },
            { id: "max", label: "最高", canonical: "max" }
          ]
        },
        {
          id: "pi",
          label: "Off / High / Max（pi-ai 声明）",
          levels: [
            { id: "off", label: "关闭", canonical: "off" },
            { id: "high", label: "高", canonical: "high" },
            { id: "max", label: "最高", canonical: "max" }
          ]
        },
        {
          id: "full",
          label: "六档全集",
          levels: [
            { id: "off", label: "关闭", canonical: "off" },
            { id: "low", label: "低", canonical: "low" },
            { id: "medium", label: "中", canonical: "medium" },
            { id: "high", label: "高", canonical: "high" },
            { id: "extra", label: "超高", canonical: "extra" },
            { id: "max", label: "最高", canonical: "max" }
          ]
        },
        {
          id: "xhigh",
          label: "Off / Xhigh / Max（pi-ai 扩展档）",
          levels: [
            { id: "off", label: "关闭", canonical: "off" },
            { id: "xhigh", label: "极高", canonical: "xhigh" },
            { id: "max", label: "最高", canonical: "max" }
          ]
        },
        {
          id: "custom",
          label: "含未知档位（Ultra）",
          levels: [
            { id: "off", label: "关闭", canonical: "off" },
            { id: "ultra", label: "Ultra", canonical: undefined },
            { id: "max", label: "最高", canonical: "max" }
          ]
        }
      ];

      var slider = document.getElementById("slider");
      var stage = document.getElementById("stage");
      var mode = document.getElementById("mode");
      var level = document.getElementById("level");
      var levelOut = document.getElementById("levelOut");
      var levelSelect = document.getElementById("levels");
      var active = LEVEL_SETS[0];

      LEVEL_SETS.forEach(function (set) {
        var option = document.createElement("option");
        option.value = set.id;
        option.textContent = set.label;
        levelSelect.appendChild(option);
      });

      // Panel mode needs a positioned host wide enough for the popup; the
      // demo swaps the wrapper class and lets the component do the rest.
      function applyMode() {
        var inline = mode.value === "inline";
        stage.dataset.mode = mode.value;
        slider.toggleAttribute("inline", inline);
        slider.toggleAttribute("open", !inline);
        var host = slider.parentElement;
        host.classList.toggle("anchor", !inline);
      }

      function levelName(index) {
        var entry = active.levels[index];
        return entry ? entry.label : "";
      }

      function applyLevel() {
        slider.value = Number(level.value);
        levelOut.textContent = levelName(Number(level.value));
      }

      function applyLevelSet() {
        slider.levels = active.levels;
        level.max = String(active.levels.length - 1);
        if (Number(level.value) > active.levels.length - 1) level.value = "0";
        applyLevel();
      }

      mode.addEventListener("change", applyMode);
      level.addEventListener("input", applyLevel);
      levelSelect.addEventListener("change", function () {
        active = LEVEL_SETS.filter(function (set) {
          return set.id === levelSelect.value;
        })[0] || LEVEL_SETS[0];
        applyLevelSet();
      });

      slider.addEventListener("ds-liang-toggle", function (event) {
        document.getElementById("liang").checked = event.detail.enabled;
      });
      document.getElementById("liang").addEventListener("change", function (event) {
        slider.liang = event.target.checked;
      });
      document.getElementById("chibi").addEventListener("change", function (event) {
        slider.chibi = event.target.checked;
      });
      document.getElementById("ultracode").addEventListener("change", function (event) {
        slider.ultracode = event.target.checked;
      });
      slider.addEventListener("change", function (event) {
        level.value = String(event.detail.index);
        levelOut.textContent = event.detail.level;
      });

      applyMode();
      slider.ultracode = document.getElementById("ultracode").checked;
      applyLevelSet();
    })();
  </script>
</body>
</html>
